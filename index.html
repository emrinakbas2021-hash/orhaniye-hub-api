<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Orhaniye Hub</title>
<style>
:root{--bg:#000;--c:#141414;--c2:#232323;--t:#f5f5f5;--m:#9a9a9a;--a:#f99b1c;--b:#2b2b2b;--g:linear-gradient(135deg,#f99b1c,#ffc266);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#2a1760 0,transparent 45%),var(--bg);background-attachment:fixed;color:var(--t);font:16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;height:58px;background:#000000ee;backdrop-filter:blur(8px);border-bottom:1px solid var(--b);display:flex;align-items:center;justify-content:space-between;padding:0 10px}
body.g header{display:none}
header h1{position:absolute;left:50%;transform:translateX(-50%);margin:0;font-size:21px;font-weight:800;white-space:nowrap;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.ib{background:var(--c);border:0;font-size:21px;width:42px;height:42px;border-radius:12px;cursor:pointer}
main{max-width:1100px;margin:auto;padding:16px}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.grid>a{background:var(--c);border-radius:16px;padding:8px;transition:.2s}.grid>a:hover{transform:translateY(-3px);box-shadow:0 8px 24px #f99b1c33}
.th{aspect-ratio:16/9;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:38px;color:#fffa}
.ci{padding:8px 4px 4px}.ci b{display:block;font-size:17px}
small,.m{color:var(--m);font-size:14px;display:block}
.bd{width:17px;height:17px;vertical-align:-3px;margin-left:3px}
.ov{position:fixed;inset:0;background:#000a;z-index:20;display:none}.ov.on{display:block}
#dr{position:fixed;top:0;bottom:0;left:0;width:310px;max-width:86%;background:var(--c);z-index:21;transform:translateX(-100%);transition:.25s;padding:18px 12px;padding-top:calc(18px + env(safe-area-inset-top,0px));overflow:auto;border-right:1px solid var(--b)}#dr.on{transform:none}
.dh{padding:6px 8px 16px;border-bottom:1px solid var(--b);margin-bottom:8px}.gt{font-size:22px;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
#dr a,#dr button.l{display:flex;align-items:center;gap:14px;padding:11px 10px;border-radius:14px;width:100%;font-size:17px;font-weight:500;background:none;border:0;cursor:pointer;text-align:left}#dr a:hover,#dr button.l:hover{background:var(--c2)}
.ic{width:40px;height:40px;border-radius:12px;background:var(--c2);display:flex;align-items:center;justify-content:center;font-size:19px}
#dr h4{margin:18px 10px 6px;color:var(--m);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
#sr{position:fixed;inset:0;background:var(--bg);z-index:22;display:none;overflow:auto;padding:14px;padding-top:calc(14px + env(safe-area-inset-top,0px))}#sr.on{display:block}
.in{width:100%;padding:13px 14px;border:1px solid var(--b);border-radius:12px;background:var(--c);margin:6px 0 12px;font-size:16px}.in:focus{outline:2px solid var(--a)}
.chip{display:inline-block;padding:9px 16px;margin:4px;border-radius:99px;background:var(--c2);cursor:pointer;border:0;font-size:15px}
.btn{background:var(--g);color:#fff;border:0;border-radius:12px;padding:12px 20px;cursor:pointer;font-weight:600;font-size:16px}.btn.g{background:var(--c2)}
.pl{position:relative;aspect-ratio:16/9;background:#000;border-radius:16px;overflow:hidden;max-width:900px;margin:auto}
.pl video,.fk{width:100%;height:100%;object-fit:contain;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:#fff;font-weight:700;font-size:20px}
.zn{position:absolute;inset:0 0 44px;display:flex}.zn div{flex:1}
.ctl{position:absolute;left:0;right:0;bottom:0;height:44px;background:#000b;display:flex;align-items:center;gap:8px;padding:0 8px;color:#fff}
.ctl button{background:none;border:0;color:#fff;font-size:18px;cursor:pointer}.ctl input{flex:1;accent-color:#f99b1c}.ctl span{font-size:12px;min-width:74px}
#fl{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#000a;color:#fff;padding:8px 14px;border-radius:99px;opacity:0;transition:.3s;pointer-events:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.box{background:var(--c);border-radius:14px;padding:14px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.fm{width:100%;max-width:420px;margin:auto;background:var(--c);border:1px solid var(--b);border-radius:22px;padding:24px;box-shadow:0 10px 40px #f99b1c22}
.nt{background:var(--c2);border-left:4px solid #f99b1c;padding:10px;border-radius:8px;margin:12px 0;font-size:13px}
.hero{text-align:center;padding:42px 18px;border-radius:22px;background:radial-gradient(circle at 50% 0,#f99b1c33,transparent 65%),var(--c);border:1px solid var(--b);margin-bottom:26px}
.hero h2,.big{margin:8px 0;font-size:28px;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}.big{font-size:38px;line-height:1.15}
.lg{font-size:54px}.ct{margin:6px 2px 14px}
.dn{margin-top:18px;color:var(--m);animation:bn 1.6s infinite}@keyframes bn{50%{transform:translateY(8px)}}
.gate{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.lk{color:#f99b1c;font-weight:700;text-decoration:underline}
#pk{position:fixed;inset:0;background:#000a;z-index:30;display:none;align-items:flex-end;justify-content:center}#pk.on{display:flex}
.sh{background:var(--c);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:22px;max-height:80vh;overflow:auto}
.ib{background:none}.btn{color:#000}.btn.g{color:#fff}body{background:#000;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}input,textarea{user-select:text;-webkit-user-select:text}video{-webkit-user-drag:none}@media print{body{display:none}}
header h1{background:none;-webkit-background-clip:initial;background-clip:initial;color:#fff}header h1 a{display:inline-flex}
.logo{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:22px;letter-spacing:-.5px;color:#fff}.logo i{font-style:normal;background:#f99b1c;color:#000;padding:0 8px 3px;border-radius:8px}
.hl,.hr{display:flex;align-items:center;gap:4px}.pl2{width:36px;height:36px;border:2.5px solid #f99b1c;border-radius:9px;background:#000;color:#f99b1c;font-size:26px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1;padding-bottom:3px}
#pf{position:fixed;top:0;bottom:0;right:0;width:310px;max-width:86%;background:var(--c);z-index:21;transform:translateX(100%);transition:.25s;padding:18px 12px;padding-top:calc(18px + env(safe-area-inset-top,0px));border-left:1px solid var(--b)}#pf.on{transform:none}
#pf a,#pf button.l{display:flex;align-items:center;gap:14px;padding:11px 10px;border-radius:14px;width:100%;font-size:17px;font-weight:500;background:none;border:0;cursor:pointer;text-align:left}#pf a:hover,#pf button.l:hover{background:var(--c2)}
.pl2{width:54px;height:40px;font-size:30px;border-radius:10px}
.bn{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;background:#f99b1c;color:#000;text-align:center;padding:12px;font-weight:700;z-index:60}
.ch{display:flex;flex-direction:column;height:calc(100svh - 120px)}#ms{flex:1;overflow:auto;padding:8px 0}
.mg{display:flex;gap:8px;margin:8px 0;align-items:flex-start;-webkit-touch-callout:none}.bb{background:#232323;border-radius:4px 14px 14px 14px;padding:7px 12px;max-width:80%}.nmx{color:#f99b1c;font-size:14px;display:block}.tx{word-break:break-word}.tx i{float:right;margin:8px 0 0 14px;font-size:11px;color:#8a8a8a;font-style:normal}
.cb2{display:flex;gap:8px;align-items:center;padding-top:8px}.em{display:flex;flex-wrap:wrap;gap:4px;background:var(--c);padding:8px;border-radius:12px}.em button{background:none;border:0;font-size:24px;cursor:pointer}
#mn{position:fixed;display:none;background:#232323;border:1px solid var(--b);border-radius:12px;z-index:40;padding:6px;min-width:150px}#mn a,#mn button{display:block;width:100%;text-align:left;padding:10px 12px;background:none;border:0;font-size:16px;border-radius:8px;cursor:pointer}
.pa{position:relative;display:inline-block}.pe{position:absolute;top:0;right:0;background:#f99b1c;color:#000;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
body.g main{margin-left:0!important}body.g #dr{display:none}
@media(min-width:900px){#dr{transform:none!important;top:calc(58px + env(safe-area-inset-top,0px));z-index:4;width:260px}.ov{display:none!important}main{margin-left:260px;max-width:none;padding:24px 32px}.hb{display:none}.grid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}.ch{max-width:760px}}
